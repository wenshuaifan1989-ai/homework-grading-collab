name: CI
on:
  push:
    branches: [develop, "feature/**", "fix/**"]
  pull_request:
    branches: [develop]
permissions:
  contents: read
jobs:
  python-tests:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite+pysqlite:////tmp/homework-grading-collab-ci.sqlite3
      REDIS_URL: memory://
      CELERY_BROKER_URL: memory://
      CELERY_RESULT_BACKEND: cache+memory://
      JWT_SECRET_KEY: test-only-ci-signing-key-not-for-deployment
      ALIYUN_ACCESS_KEY_ID: ""
      ALIYUN_ACCESS_KEY_SECRET: ""
      WECHAT_APP_ID: ""
      WECHAT_APP_SECRET: ""
      DEEPSEEK_API_KEY: ""
      DASHSCOPE_API_KEY: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Poppler utilities
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends poppler-utils
          pdftoppm -v
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt pytest httpx
      - run: python scripts/check_collab_safety.py
      - run: python scripts/check_miniprogram.py
      - run: python -m pytest -q tests
  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: node tests/test_009a_miniprogram_auth.js
      - run: node tests/test_009bcd_miniprogram.js
      - run: node tests/test_v2_001_workspace.mjs

